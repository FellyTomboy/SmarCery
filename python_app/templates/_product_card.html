<article class="card h-100 shadow-sm">{% if product.image_url %}<img class="card-img-top" src="{{ product.image_url }}" alt="Foto {{ product.name }}" style="height: 180px; object-fit: cover;">{% endif %}<div class="card-body"><span class="badge text-bg-light mb-2">{{ product.category_name }}</span><h2 class="h5"><a class="text-decoration-none" href="{{ url('/user/product.php') }}?id={{ product._id }}">{{ product.name }}</a></h2><p class="text-secondary small mb-2">{{ product.brand or 'Tanpa merek' }}</p><p class="fw-bold text-primary mb-0">Rp {{ '{:,.0f}'.format(product.price or 0).replace(',', '.') }}</p></div></article>
