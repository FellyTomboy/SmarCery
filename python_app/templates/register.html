{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card border-0 shadow-sm"><div class="card-body p-4">
<h1 class="h3 mb-3">Buat akun baru</h1>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="post" class="vstack gap-3"><label class="form-label">Nama lengkap<input class="form-control" name="name" required></label><label class="form-label">Email<input class="form-control" type="email" name="email" required></label><label class="form-label">Password<input class="form-control" type="password" name="password" minlength="8" required></label><label class="form-label">Konfirmasi password<input class="form-control" type="password" name="password_confirm" minlength="8" required></label><button class="btn btn-primary">Daftar</button></form>
<p class="small text-center mt-4 mb-0">Sudah punya akun? <a href="{{ url('/login.php') }}">Masuk</a></p>
</div></div></div></div>
{% endblock %}
