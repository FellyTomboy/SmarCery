{% extends 'base.html' %}
{% block content %}<h1 class="h2">Profil Kesehatan</h1><p class="text-secondary">Atur preferensi kesehatan untuk rekomendasi yang lebih relevan.</p><form method="post" class="card border-0 shadow-sm p-4"><fieldset class="mb-4"><legend class="h5">Preferensi Diet</legend><div class="d-flex flex-wrap gap-3">{% for diet in ['vegan','vegetarian','halal','keto'] %}<label class="form-check"><input class="form-check-input" type="checkbox" name="diet" value="{{ diet }}" {% if diet in (profile.diet_tags or '') %}checked{% endif %}><span class="form-check-label">{{ diet.title() }}</span></label>{% endfor %}</div></fieldset><fieldset class="mb-4"><legend class="h5">Alergen</legend><div class="row row-cols-1 row-cols-md-3 g-2">{% for allergen in allergens %}<label class="form-check"><input class="form-check-input" type="checkbox" name="allergen" value="{{ allergen.slug }}"><span class="form-check-label">{{ allergen.name }}</span></label>{% endfor %}</div></fieldset><label class="form-label">Catatan<textarea class="form-control" name="other_notes" rows="4">{{ profile.other_notes or '' }}</textarea></label><button class="btn btn-primary mt-3">Simpan profil</button></form>{% endblock %}
