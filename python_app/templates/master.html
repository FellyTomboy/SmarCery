{% extends 'base.html' %}
{% block content %}<div class="d-flex justify-content-between align-items-center mb-4"><h1 class="h2">{{ heading }}</h1></div><form method="post" class="card card-body mb-4"><input type="hidden" name="action" value="create"><div class="row g-2"><div class="col-md-5"><input class="form-control" name="name" placeholder="Nama" required></div><div class="col-md-5"><input class="form-control" name="slug" placeholder="Slug" required></div><div class="col-md-2"><button class="btn btn-primary w-100">Tambah</button></div></div></form><div class="table-responsive"><table class="table table-hover bg-white"><thead><tr>{% for column in columns %}<th>{{ column }}</th>{% endfor %}<th>Aksi</th></tr></thead><tbody>{% for row in rows %}<tr>{% for cell in row %}<td>{{ cell }}</td>{% endfor %}<td class="d-flex gap-2"><form method="post" class="d-flex gap-2"><input type="hidden" name="action" value="update"><input type="hidden" name="id" value="{{ row[0] }}"><input class="form-control form-control-sm" name="name" value="{{ row[1] }}" required><input class="form-control form-control-sm" name="slug" value="{{ row[2] }}" required><button class="btn btn-sm btn-outline-primary">Simpan</button></form><form method="post"><input type="hidden" name="action" value="delete"><input type="hidden" name="id" value="{{ row[0] }}"><button class="btn btn-sm btn-outline-danger" onclick="return confirm('Hapus data ini?')">Hapus</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
