{% extends 'base.html' %}
{% block content %}{% set editing = product is not none %}<h1 class="h2 mb-4">{{ 'Edit' if editing else 'Tambah' }} Produk</h1><form method="post" class="card border-0 shadow-sm p-4"><div class="row g-3"><div class="col-md-8"><label class="form-label">Nama<input class="form-control" name="name" required value="{{ product.name if editing else '' }}"></label></div><div class="col-md-4"><label class="form-label">Merek<input class="form-control" name="brand" value="{{ product.brand if editing else '' }}"></label></div><div class="col-md-4"><label class="form-label">Kategori<select class="form-select" name="category_id">{% for category in categories %}<option value="{{ category.id }}" {% if editing and product.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></label></div><div class="col-md-4"><label class="form-label">Harga<input class="form-control" type="number" name="price" step="0.01" value="{{ product.price if editing else 0 }}"></label></div><div class="col-md-4"><label class="form-label">Stok<input class="form-control" type="number" name="stock" value="{{ product.stock if editing else 0 }}"></label></div><div class="col-md-6"><label class="form-label">Alergen, pisahkan koma<input class="form-control" name="allergens" value="{{ product.allergens|join(',') if editing else '' }}"></label></div><div class="col-md-6"><label class="form-label">Barcode<input class="form-control" name="barcode" value="{{ product.barcode if editing else '' }}"></label></div></div><div class="form-check mt-3"><input class="form-check-input" type="checkbox" name="vegan" value="1" {% if editing and product.attributes.vegan %}checked{% endif %}><label class="form-check-label">Vegan</label></div><div class="form-check"><input class="form-check-input" type="checkbox" name="halal" value="1" {% if editing and product.attributes.halal_certified %}checked{% endif %}><label class="form-check-label">Halal</label></div><div class="form-check mt-2"><input class="form-check-input" type="checkbox" name="is_active" value="1" checked><label class="form-check-label">Aktif</label></div><button class="btn btn-primary mt-4">Simpan</button></form>{% endblock %}
