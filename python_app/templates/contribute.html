{% extends 'base.html' %}
{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><h1 class="h2">Kontribusi Informasi Produk</h1><p class="text-secondary">Bantu memperbaiki data produk untuk pengguna lain.</p><form method="post" class="card border-0 shadow-sm p-4"><input type="hidden" name="product_id" value="{{ product_id }}"><label class="form-label">Jenis kontribusi<select class="form-select" name="type"><option value="allergen_claim">Klaim alergen tambahan</option><option value="ingredient_correction">Koreksi komposisi</option><option value="packaging_photo">Foto kemasan terbaru</option></select></label><label class="form-label">Nilai baru<input class="form-control" name="new_value" required></label><label class="form-label">Catatan<textarea class="form-control" name="note" rows="4"></textarea></label><button class="btn btn-primary">Kirim kontribusi</button></form></div></div>{% endblock %}
